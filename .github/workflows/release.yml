name: Build signed LumaHub release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example v0.2.0"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  android-release:
    name: Signed Android release
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve release metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d+ -f1)"
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="${{ inputs.tag }}"
          fi
          if [[ "$TAG" != "v$VERSION" ]]; then
            echo "Tag $TAG does not match pubspec version v$VERSION" >&2
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Configure Android signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          : "${KEYSTORE_BASE64:?ANDROID_KEYSTORE_BASE64 is not configured}"
          : "${KEY_ALIAS:?ANDROID_KEY_ALIAS is not configured}"
          : "${KEY_PASSWORD:?ANDROID_KEY_PASSWORD is not configured}"
          : "${STORE_PASSWORD:?ANDROID_STORE_PASSWORD is not configured}"

          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          cat > android/key.properties <<EOF
          storePassword=$STORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF

      - name: Resolve dependencies
        run: flutter pub get

      - name: Verify lockfile
        run: git diff --exit-code pubspec.lock

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Run tests
        run: flutter test --coverage

      - name: Build signed and obfuscated APK
        run: flutter build apk --release --obfuscate --split-debug-info=build/symbols

      - name: Verify APK signature
        shell: bash
        run: |
          set -euo pipefail
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          "$APKSIGNER" verify --verbose --print-certs build/app/outputs/flutter-apk/app-release.apk

      - name: Prepare release files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          cp build/app/outputs/flutter-apk/app-release.apk release/LumaHub-android.apk
          zip -r release/LumaHub-ESP32-firmware.zip firmware/esp32_ble_controller
          zip -r release/LumaHub-symbols.zip build/symbols
          zip -r release/LumaHub-sources.zip \
            README.md CHANGELOG.md pubspec.yaml pubspec.lock \
            lib assets android ios test integration_test docs examples firmware \
            -x "android/.gradle/*" "android/app/build/*" "android/key.properties" "*.jks"

          cat > release-notes.md <<'EOF'
          # LumaHub

          LumaHub configures and controls an eight-channel ESP32 lighting controller over Bluetooth Low Energy.

          ## Downloads

          - `LumaHub-android.apk` — signed Android application.
          - `LumaHub-ESP32-firmware.zip` — ESP32 firmware.
          - `LumaHub-symbols.zip` — symbols required to decode obfuscated crash traces.
          - `LumaHub-sources.zip` — source code, tests, documentation, and examples.

          ## Safety

          Validate the exact ESP32 board, driver stage, wiring, power supply, loads, and phone model before deployment. ESP32 GPIO must never power a load directly. The current BLE protocol requires additional authenticated pairing before use in an environment where unauthorized nearby control creates risk.
          EOF

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ steps.meta.outputs.tag }}
          VERSION: ${{ steps.meta.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" release/* --clobber
            gh release edit "$TAG_NAME" \
              --title "LumaHub ${VERSION}" \
              --notes-file release-notes.md
          else
            gh release create "$TAG_NAME" release/* \
              --target "$GITHUB_SHA" \
              --title "LumaHub ${VERSION}" \
              --notes-file release-notes.md
          fi
