name: Build LumaHub APK and publish release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example v0.1.1. Use v0.1.0 to refresh the existing release."
        required: false
        type: string

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  android-release:
    name: LumaHub Android APK release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve release metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d+ -f1)"
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            TAG="${GITHUB_REF_NAME}"
          elif [[ -n "${{ inputs.tag }}" ]]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="v${VERSION}-${GITHUB_RUN_NUMBER}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test --coverage

      - name: Build release APK
        run: flutter build apk --release

      - name: Prepare release files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          cp build/app/outputs/flutter-apk/app-release.apk release/LumaHub-android.apk
          zip -r release/LumaHub-ESP32-firmware.zip firmware/esp32_ble_controller
          zip -r release/LumaHub-sources.zip \
            AGENTS.md README.md CHANGELOG.md pubspec.yaml pubspec.lock \
            lib assets android ios test integration_test docs examples firmware \
            -x "android/.gradle/*" "android/app/build/*"

          cat > release-notes.md <<'EOF'
          # LumaHub

          LumaHub is an MVP for configuring and controlling an eight-channel ESP32 lighting controller over Bluetooth Low Energy.

          ## Included

          - Android application built with Flutter.
          - ESP32 BLE firmware.
          - Eight configurable output channels.
          - Manual channel and group control.
          - Strobe, alternate, and sequence patterns.
          - Local profiles with JSON import and export.
          - GPIO, output inversion, and fail-safe configuration.
          - Heartbeat-based fail-safe shutdown.
          - Diagnostic and GPIO test tools.
          - Complete source package and hardware documentation.

          ## Downloads

          - `LumaHub-android.apk` — Android application.
          - `LumaHub-ESP32-firmware.zip` — ESP32 firmware.
          - `LumaHub-sources.zip` — application, firmware, tests, documentation, and examples.

          ## Installation

          BLE discovery and connection are performed inside LumaHub. Do not pair the ESP32 through the Android system Bluetooth screen.

          ## Hardware safety

          ESP32 GPIO pins must only drive logic-level inputs of a suitable MOSFET, transistor, relay-driver, or optocoupler stage. Do not connect automotive or other power loads directly to ESP32 GPIO. Validate the system with LEDs or a multimeter before connecting production hardware.
          EOF

      - name: Publish or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ steps.meta.outputs.tag }}
          VERSION: ${{ steps.meta.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" release/* --clobber
            gh release edit "$TAG_NAME" \
              --title "LumaHub ${VERSION} — ESP32 BLE MVP" \
              --notes-file release-notes.md

            gh release delete-asset "$TAG_NAME" StagePatch-release.apk --yes || true
            gh release delete-asset "$TAG_NAME" ESP32_firmware_only.zip --yes || true
            gh release delete-asset "$TAG_NAME" StagePatch_sources.zip --yes || true
          else
            gh release create "$TAG_NAME" release/* \
              --target "$GITHUB_SHA" \
              --title "LumaHub ${VERSION} — ESP32 BLE MVP" \
              --notes-file release-notes.md
          fi
